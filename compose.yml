services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: course
      POSTGRES_PASSWORD: course_local
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${COURSE_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, course, -d, postgres]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
